name: Build desktop app

# Builds installers on native runners. Manual runs and pushes upload the files as
# workflow artifacts; pushing a tag like v1.0.0 also publishes a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: ['claude/vocal-chop-studio-2kd970', 'main']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            files: |
              release/*.exe
              release/*.zip
          - os: macos-latest
            target: --mac dmg
            files: release/*.dmg
          - os: ubuntu-latest
            target: --linux AppImage
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: vocal-chop-studio-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
